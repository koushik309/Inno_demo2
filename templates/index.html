<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Monitoring System</title>
    <style>
        /* Basic styles for the buttons, status bar, and image */
        body { font-family: Arial, sans-serif; }
        #status-bar { display: none; background-color: yellow; padding: 10px; text-align: center; }
        .disabled { opacity: 0.5; pointer-events: none; }
        img { width: 100%; max-width: 600px; }
        #info-box { border: 1px solid #ccc; padding: 10px; margin-top: 10px; }
    </style>
    <script>
        let predictionInProgress = false;

        function checkPredictionStatus() {
            fetch('/prediction_status')
                .then(response => response.json())
                .then(data => {
                    predictionInProgress = data.prediction_running || data.biomass_cal_running;

                    const statusBar = document.getElementById('status-bar');
                    const buttons = document.querySelectorAll('button');

                    if (predictionInProgress) {
                        statusBar.style.display = 'block';
                        buttons.forEach(button => button.classList.add('disabled'));
                    } else {
                        statusBar.style.display = 'none';
                        buttons.forEach(button => button.classList.remove('disabled'));
                    }
                })
                .catch(error => console.error('Error checking prediction status:', error));
        }

        document.addEventListener('DOMContentLoaded', () => {
            setInterval(checkPredictionStatus, 1000);
        });
    </script>
</head>
<body>
    <div id="status-bar">Please wait, processing...</div>
    
    <!-- Image display area -->
    <div>
        <img src="{{ url_for('send_image', filepath=displayed_image) }}" alt="Selected Image">
    </div>
    
    <!-- Buttons for selecting image source -->
    <div>
        <form action="{{ url_for('load_image') }}" method="post">
            <button type="submit" name="source_type" value="db">Load DB Image</button>
            <button type="submit" name="source_type" value="cam1">Capture from Cam1</button>
            <button type="submit" name="source_type" value="cam2">Capture from Cam2</button>
        </form>
    </div>

    <!-- Buttons for generating reports -->
    <div>
        <form action="{{ url_for('report') }}" method="get">
            <button type="submit" name="type" value="classification_report">Classification Report</button>
            <button type="submit" name="type" value="developer_mode">Developer Mode</button>
        </form>
    </div>

    <!-- Info box for displaying JSON data -->
    <div id="info-box">
        {{ json_info }}
    </div>
</body>
</html>
